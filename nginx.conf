##############################################################################
# Globetrotter SaaS – Nginx Production Config
# Place at: /etc/nginx/sites-available/globetrotter
# Enable:   ln -s /etc/nginx/sites-available/globetrotter /etc/nginx/sites-enabled/
##############################################################################

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ─── API ───────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.globetrotter.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.globetrotter.nl;

    ssl_certificate     /etc/letsencrypt/live/api.globetrotter.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.globetrotter.nl/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Stripe webhook – no rate limit (handles its own auth)
    location /api/stripe/webhook {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Auth endpoints – strict rate limit
    location ~ ^/api/auth/(login|register|forgot-password) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # All other API
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ─── User Frontend ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.globetrotter.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.globetrotter.nl;

    ssl_certificate     /etc/letsencrypt/live/app.globetrotter.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.globetrotter.nl/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /srv/globetrotter/frontend;
    index dashboard.html index.html;

    location / {
        try_files $uri $uri/ /dashboard.html;
        gzip_static on;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ─── Admin Dashboard ───────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.globetrotter.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.globetrotter.nl;

    ssl_certificate     /etc/letsencrypt/live/admin.globetrotter.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.globetrotter.nl/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # IP allowlist for admin panel (uncomment and set your IP)
    # allow 1.2.3.4;
    # deny all;

    root /srv/globetrotter/frontend;
    index admin.html;

    location / {
        try_files $uri $uri/ /admin.html;
    }
}

# ─── Wildcard tenant routing ────────────────────────────────────────────────────
server {
    listen 80;
    server_name ~^(?<tenant>.+)\.globetrotter\.nl$;
    return 301 https://app.globetrotter.nl?tenant=$tenant;
}
