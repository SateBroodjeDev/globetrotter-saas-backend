<!DOCTYPE html>
<html lang="nl" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globetrotter SaaS - Production</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .tab-content { display: none; } .tab-content.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col bg-slate-950">

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="glass-card bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
            <div class="text-center">
                <div class="p-3.5 bg-gradient-to-tr from-sky-600 to-indigo-600 rounded-2xl shadow-lg shadow-sky-500/20 text-white flex items-center justify-center mx-auto mb-4 w-16 h-16">
                    <i data-lucide="compass" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-white">Globetrotter</h1>
                <p class="text-xs text-slate-400 mt-1">Enterprise SaaS Travel Planner</p>
            </div>

            <div id="login-form" class="space-y-4">
                <input type="email" id="auth-email" placeholder="Email" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:border-sky-500 focus:outline-none">
                <input type="password" id="auth-password" placeholder="Wachtwoord" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:border-sky-500 focus:outline-none">
                <button onclick="handleLogin()" class="w-full py-2.5 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-bold rounded-xl text-sm transition">
                    <span id="login-btn">Inloggen</span>
                </button>
                <p id="auth-error" class="text-xs text-rose-400 text-center hidden"></p>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="hidden flex-grow flex flex-col">
        <!-- Header -->
        <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center space-x-3">
                        <div class="p-2.5 bg-gradient-to-tr from-sky-600 to-indigo-600 rounded-xl text-white">
                            <i data-lucide="compass" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-extrabold text-base text-white">Globetrotter</h1>
                            <p class="text-[11px] text-slate-400">Multi-Tenant SaaS</p>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="px-3 py-1.5 bg-rose-900/60 hover:bg-rose-800/60 text-rose-300 rounded border border-rose-700/60 transition flex items-center gap-1 text-xs">
                        <i data-lucide="log-out" class="w-3 h-3"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <!-- Dashboard -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="glass-card rounded-2xl p-5 space-y-3">
                    <h3 class="text-sm font-bold text-white">📊 Total Trips</h3>
                    <p class="text-2xl font-bold text-sky-400" id="total-trips">-</p>
                </div>
                <div class="glass-card rounded-2xl p-5 space-y-3">
                    <h3 class="text-sm font-bold text-white">💰 Total Expenses</h3>
                    <p class="text-2xl font-bold text-emerald-400" id="total-expenses">€-</p>
                </div>
                <div class="glass-card rounded-2xl p-5 space-y-3">
                    <h3 class="text-sm font-bold text-white">👥 Workspace Members</h3>
                    <p class="text-2xl font-bold text-amber-400" id="workspace-members">-</p>
                </div>
            </div>

            <div class="mt-6 glass-card rounded-2xl p-5">
                <h2 class="text-base font-bold text-white mb-4">Your Trips</h2>
                <div id="trips-list" class="space-y-2">
                    <p class="text-xs text-slate-400">Loading...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let accessToken = localStorage.getItem('gt_token');
        let currentWorkspace = null;

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (!email || !password) {
                showAuthError('Vul email en wachtwoord in');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error);

                accessToken = data.accessToken;
                localStorage.setItem('gt_token', accessToken);
                localStorage.setItem('gt_workspace', data.workspaces[0].id);
                
                showApp();
                loadDashboard();
            } catch (error) {
                showAuthError(error.message);
            }
        }

        async function handleLogout() {
            localStorage.removeItem('gt_token');
            localStorage.removeItem('gt_workspace');
            location.reload();
        }

        function showAuthError(msg) {
            const err = document.getElementById('auth-error');
            err.innerText = msg;
            err.classList.remove('hidden');
            setTimeout(() => err.classList.add('hidden'), 5000);
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
        }

        async function loadDashboard() {
            const workspaceId = localStorage.getItem('gt_workspace');
            try {
                const res = await fetch(`${API_URL}/workspaces/${workspaceId}`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await res.json();
                currentWorkspace = data.workspace;

                // Load trips
                const tripsRes = await fetch(`${API_URL}/trips/workspace/${workspaceId}`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const tripsData = await tripsRes.json();

                document.getElementById('total-trips').innerText = tripsData.trips?.length || 0;
                document.getElementById('workspace-members').innerText = currentWorkspace.members?.length || 0;

                const totalExpenses = (tripsData.trips || []).reduce((sum, trip) => 
                    sum + (trip.expenses || []).reduce((s, e) => s + parseFloat(e.amountEur || 0), 0), 0
                );
                document.getElementById('total-expenses').innerText = '€' + totalExpenses.toFixed(2);

                // Render trips
                const tripsList = document.getElementById('trips-list');
                if (tripsData.trips?.length) {
                    tripsList.innerHTML = tripsData.trips.map(trip => `
                        <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 flex justify-between items-center">
                            <div>
                                <p class="text-sm font-bold text-white">${trip.title}</p>
                                <p class="text-xs text-slate-400">${new Date(trip.startDate).toLocaleDateString()} → ${new Date(trip.endDate).toLocaleDateString()}</p>
                            </div>
                            <span class="text-xs px-2 py-1 rounded bg-sky-500/20 text-sky-300">${trip.type}</span>
                        </div>
                    `).join('');
                } else {
                    tripsList.innerHTML = '<p class="text-xs text-slate-400">No trips yet. Create one to get started!</p>';
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            if (accessToken) {
                showApp();
                loadDashboard();
            }
        });
    </script>
</body>
</html>
