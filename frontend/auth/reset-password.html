<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Globetrotter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center p-4 min-h-screen">
  <div class="glass-card rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
    <div class="text-center">
      <div class="p-3.5 bg-gradient-to-tr from-sky-600 to-indigo-600 rounded-2xl text-white flex items-center justify-center mx-auto mb-4 w-16 h-16">
        <i data-lucide="lock" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-white">Set New Password</h1>
      <p class="text-xs text-slate-400 mt-1">Choose a strong password</p>
    </div>

    <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/30 rounded-xl p-3 text-red-400 text-sm"></div>
    <div id="expired-msg" class="hidden bg-yellow-500/10 border border-yellow-500/30 rounded-xl p-3 text-yellow-400 text-sm">
      This reset link has expired or is invalid.
      <a href="/auth/forgot-password.html" class="underline ml-1">Request a new one</a>.
    </div>

    <form id="reset-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">New Password</label>
        <input type="password" id="password" required placeholder="Min 8 chars, uppercase &amp; number"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Confirm Password</label>
        <input type="password" id="confirmPassword" required placeholder="Repeat password"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500" />
      </div>

      <button type="submit" id="submit-btn"
        class="w-full py-3 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-semibold rounded-xl transition-all text-sm flex items-center justify-center gap-2">
        <span id="btn-text">Reset Password</span>
        <i id="btn-spinner" data-lucide="loader" class="hidden w-4 h-4 animate-spin"></i>
      </button>
    </form>

    <p class="text-center text-sm text-slate-400">
      <a href="/auth/login.html" class="text-sky-400 hover:text-sky-300 font-medium">&larr; Back to login</a>
    </p>
  </div>

  <script>
    lucide.createIcons();

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('reset-form').classList.add('hidden');
      document.getElementById('expired-msg').classList.remove('hidden');
    }

    const form = document.getElementById('reset-form');
    const errorMsg = document.getElementById('error-msg');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    function setLoading(on) {
      document.getElementById('submit-btn').disabled = on;
      btnText.textContent = on ? 'Resetting...' : 'Reset Password';
      btnSpinner.classList.toggle('hidden', !on);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password !== confirm) {
        errorMsg.textContent = 'Passwords do not match';
        return errorMsg.classList.remove('hidden');
      }
      if (password.length < 8) {
        errorMsg.textContent = 'Password must be at least 8 characters';
        return errorMsg.classList.remove('hidden');
      }

      setLoading(true);
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password })
        });
        const data = await res.json();
        if (!res.ok) {
          if (res.status === 400 || res.status === 410) {
            form.classList.add('hidden');
            document.getElementById('expired-msg').classList.remove('hidden');
            return;
          }
          throw new Error(data.error?.message || data.error || 'Reset failed');
        }

        window.location.href = '/auth/login.html?reset=success';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
