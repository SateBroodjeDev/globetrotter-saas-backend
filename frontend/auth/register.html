<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Globetrotter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center p-4 min-h-screen">
  <div class="glass-card rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
    <div class="text-center">
      <div class="p-3.5 bg-gradient-to-tr from-sky-600 to-indigo-600 rounded-2xl text-white flex items-center justify-center mx-auto mb-4 w-16 h-16">
        <i data-lucide="compass" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-white">Create Account</h1>
      <p class="text-xs text-slate-400 mt-1">Start planning your adventures</p>
    </div>

    <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/30 rounded-xl p-3 text-red-400 text-sm"></div>

    <form id="register-form" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">First Name</label>
          <input type="text" id="firstName" required placeholder="Jane"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Last Name</label>
          <input type="text" id="lastName" required placeholder="Doe"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
        <input type="email" id="email" required placeholder="jane@example.com"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
        <input type="password" id="password" required placeholder="Min 8 chars, uppercase &amp; number"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Confirm Password</label>
        <input type="password" id="confirmPassword" required placeholder="Repeat password"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500" />
      </div>

      <button type="submit" id="submit-btn"
        class="w-full py-3 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-semibold rounded-xl transition-all text-sm flex items-center justify-center gap-2">
        <span id="btn-text">Create Account</span>
        <i id="btn-spinner" data-lucide="loader" class="hidden w-4 h-4 animate-spin"></i>
      </button>
    </form>

    <p class="text-center text-sm text-slate-400">
      Already have an account?
      <a href="/auth/login.html" class="text-sky-400 hover:text-sky-300 font-medium">Sign in</a>
    </p>
  </div>

  <script>
    lucide.createIcons();

    const form = document.getElementById('register-form');
    const errorMsg = document.getElementById('error-msg');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove('hidden');
    }

    function setLoading(on) {
      document.getElementById('submit-btn').disabled = on;
      btnText.textContent = on ? 'Creating account...' : 'Create Account';
      btnSpinner.classList.toggle('hidden', !on);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password !== confirm) return showError('Passwords do not match');
      if (password.length < 8) return showError('Password must be at least 8 characters');

      setLoading(true);
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || data.error || 'Registration failed');

        window.location.href = '/auth/verify-email.html?email=' + encodeURIComponent(email);
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
