<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users – Globetrotter Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: system-ui, sans-serif; }</style>
</head>
<body class="h-full text-gray-100 bg-gray-950">

<!-- Auth gate -->
<div id="auth-gate" class="fixed inset-0 bg-gray-950 z-50 flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-700 rounded-2xl p-8 w-full max-w-sm space-y-5 shadow-2xl">
    <div class="text-center">
      <div class="w-14 h-14 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-3"><i data-lucide="shield" class="w-7 h-7 text-white"></i></div>
      <h1 class="text-xl font-bold">Admin Panel</h1>
    </div>
    <input id="login-email" type="email" placeholder="Admin email" class="w-full bg-gray-800 border border-gray-600 rounded-xl px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
    <input id="login-password" type="password" placeholder="Password" class="w-full bg-gray-800 border border-gray-600 rounded-xl px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
    <button onclick="handleLogin()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition">Sign In</button>
    <p id="login-error" class="text-xs text-red-400 text-center hidden"></p>
  </div>
</div>

<!-- Modal backdrop -->
<div id="modal-backdrop" class="fixed inset-0 bg-black/60 z-40 hidden flex items-center justify-center p-4">
  <div id="user-modal" class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-lg p-6 space-y-4">
    <div class="flex items-center justify-between">
      <h3 class="font-semibold text-lg" id="modal-title">User Details</h3>
      <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="modal-content" class="space-y-3 text-sm"></div>
    <div id="modal-actions" class="flex gap-3 pt-2 flex-wrap"></div>
  </div>
</div>

<div id="app" class="hidden h-full flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
    <div class="px-5 py-5 border-b border-gray-800">
      <a href="dashboard.html" class="flex items-center gap-3">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center"><i data-lucide="compass" class="w-4 h-4 text-white"></i></div>
        <span class="font-bold text-sm">Globetrotter Admin</span>
      </a>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</a>
      <a href="users.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm bg-indigo-600 text-white"><i data-lucide="users" class="w-4 h-4"></i> Users</a>
      <a href="workspaces.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="building-2" class="w-4 h-4"></i> Workspaces</a>
      <a href="subscriptions.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="credit-card" class="w-4 h-4"></i> Subscriptions</a>
      <a href="payments.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="receipt" class="w-4 h-4"></i> Payments</a>
      <a href="analytics.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="bar-chart-2" class="w-4 h-4"></i> Analytics</a>
      <a href="audit-logs.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="scroll-text" class="w-4 h-4"></i> Audit Logs</a>
      <a href="settings.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="settings" class="w-4 h-4"></i> Settings</a>
    </nav>
    <div class="px-3 py-4 border-t border-gray-800">
      <button onclick="handleLogout()" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-red-400 hover:bg-red-950 w-full"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto">
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
      <h2 class="font-semibold text-lg">Users</h2>
      <span id="admin-email" class="text-xs text-gray-400"></span>
    </header>

    <div class="p-6 space-y-4">
      <!-- Filters -->
      <div class="flex flex-wrap gap-3">
        <input id="search" type="text" placeholder="Search email or name…" oninput="debouncedLoad()" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none w-64">
        <select id="status-filter" onchange="loadUsers()" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none">
          <option value="">All statuses</option>
          <option value="active">Active</option>
          <option value="banned">Banned</option>
        </select>
        <button onclick="exportCSV()" class="ml-auto px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm">Export CSV</button>
      </div>

      <!-- Table -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-800 text-gray-400 text-xs uppercase">
            <tr>
              <th class="px-4 py-3 text-left">Email</th>
              <th class="px-4 py-3 text-left">Name</th>
              <th class="px-4 py-3 text-left">Role</th>
              <th class="px-4 py-3 text-left">Status</th>
              <th class="px-4 py-3 text-left">Created</th>
              <th class="px-4 py-3 text-left">Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody" class="divide-y divide-gray-800">
            <tr><td colspan="6" class="px-4 py-6 text-center text-gray-500">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="flex items-center justify-between text-sm text-gray-400">
        <span id="page-info">—</span>
        <div class="flex gap-2">
          <button id="btn-prev" onclick="changePage(-1)" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded-lg disabled:opacity-40">Prev</button>
          <button id="btn-next" onclick="changePage(1)" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded-lg disabled:opacity-40">Next</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="_admin.js"></script>
<script>
  let currentPage = 1;
  let totalPages = 1;
  let debounceTimer;

  function debouncedLoad() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { currentPage = 1; loadUsers(); }, 300);
  }

  async function loadUsers() {
    const search = document.getElementById('search').value;
    const status = document.getElementById('status-filter').value;
    let url = `/admin/users?page=${currentPage}&limit=20`;
    if (search) url += `&search=${encodeURIComponent(search)}`;
    if (status) url += `&status=${status}`;

    try {
      const data = await adminFetch(url);
      totalPages = data.pages || 1;
      document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages} (${fmt(data.total)} users)`;
      document.getElementById('btn-prev').disabled = currentPage <= 1;
      document.getElementById('btn-next').disabled = currentPage >= totalPages;

      const tbody = document.getElementById('users-tbody');
      if (!data.users || data.users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-6 text-center text-gray-500">No users found</td></tr>';
        return;
      }

      tbody.innerHTML = data.users.map(u => `
        <tr class="hover:bg-gray-800/50 cursor-pointer">
          <td class="px-4 py-3 font-medium">${u.email}</td>
          <td class="px-4 py-3 text-gray-300">${u.firstName || ''} ${u.lastName || ''}</td>
          <td class="px-4 py-3"><span class="px-2 py-0.5 rounded text-xs ${u.role === 'admin' ? 'bg-indigo-900 text-indigo-300' : 'bg-gray-700 text-gray-300'}">${u.role}</span></td>
          <td class="px-4 py-3"><span class="px-2 py-0.5 rounded text-xs ${u.isActive ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'}">${u.isActive ? 'Active' : 'Banned'}</span></td>
          <td class="px-4 py-3 text-gray-400 text-xs">${fmtDate(u.createdAt)}</td>
          <td class="px-4 py-3">
            <div class="flex gap-2">
              <button onclick="viewUser('${u.id}')" class="text-xs px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded">View</button>
              ${u.isActive
                ? `<button onclick="banUser('${u.id}', true)" class="text-xs px-2 py-1 bg-red-900 hover:bg-red-800 text-red-300 rounded">Ban</button>`
                : `<button onclick="banUser('${u.id}', false)" class="text-xs px-2 py-1 bg-green-900 hover:bg-green-800 text-green-300 rounded">Unban</button>`
              }
              <button onclick="resetPassword('${u.id}')" class="text-xs px-2 py-1 bg-yellow-900 hover:bg-yellow-800 text-yellow-300 rounded">Reset PW</button>
            </div>
          </td>
        </tr>
      `).join('');
    } catch(e) { console.error(e); }
  }

  function changePage(delta) {
    currentPage = Math.max(1, Math.min(totalPages, currentPage + delta));
    loadUsers();
  }

  async function viewUser(id) {
    try {
      const u = await adminFetch(`/admin/users/${id}`);
      document.getElementById('modal-title').textContent = u.email;
      document.getElementById('modal-content').innerHTML = `
        <div class="grid grid-cols-2 gap-2">
          <div><p class="text-gray-400 text-xs">Name</p><p>${u.firstName || ''} ${u.lastName || ''}</p></div>
          <div><p class="text-gray-400 text-xs">Role</p><p>${u.role}</p></div>
          <div><p class="text-gray-400 text-xs">Status</p><p class="${u.isActive ? 'text-green-400' : 'text-red-400'}">${u.isActive ? 'Active' : 'Banned'}</p></div>
          <div><p class="text-gray-400 text-xs">Email Verified</p><p>${u.emailVerified ? 'Yes' : 'No'}</p></div>
          <div><p class="text-gray-400 text-xs">Created</p><p>${fmtDate(u.createdAt)}</p></div>
          <div><p class="text-gray-400 text-xs">Last Login</p><p>${fmtDateTime(u.lastLogin || u.lastLoginAt)}</p></div>
        </div>
        <div class="mt-2">
          <p class="text-gray-400 text-xs mb-1">Workspaces</p>
          ${(u.workspaces || []).map(w => `<span class="inline-block bg-gray-700 px-2 py-0.5 rounded text-xs mr-1 mb-1">${w.name} (${w.planTier})</span>`).join('') || '<span class="text-gray-500 text-xs">None</span>'}
        </div>
      `;
      document.getElementById('modal-actions').innerHTML = `
        <button onclick="banUser('${u.id}', ${u.isActive}); closeModal();" class="px-3 py-1.5 text-xs rounded-lg ${u.isActive ? 'bg-red-700 hover:bg-red-600' : 'bg-green-700 hover:bg-green-600'}">${u.isActive ? 'Ban User' : 'Unban User'}</button>
        <button onclick="resetPassword('${u.id}')" class="px-3 py-1.5 text-xs bg-yellow-700 hover:bg-yellow-600 rounded-lg">Reset Password</button>
        <button onclick="impersonate('${u.id}')" class="px-3 py-1.5 text-xs bg-indigo-700 hover:bg-indigo-600 rounded-lg">Impersonate</button>
      `;
      document.getElementById('modal-backdrop').classList.remove('hidden');
      lucide.createIcons();
    } catch(e) { showToast('Failed to load user', 'error'); }
  }

  async function banUser(id, ban) {
    try {
      await adminFetch(`/admin/users/${id}/${ban ? 'ban' : 'unban'}`, { method: 'POST' });
      showToast(ban ? 'User banned' : 'User unbanned');
      loadUsers();
    } catch(e) { showToast('Action failed', 'error'); }
  }

  async function resetPassword(id) {
    if (!confirm('Reset this user\'s password?')) return;
    try {
      const data = await adminFetch(`/admin/users/${id}/reset-password`, { method: 'POST' });
      showToast('Temp password: ' + data.tempPassword);
    } catch(e) { showToast('Action failed', 'error'); }
  }

  async function impersonate(id) {
    try {
      const data = await adminFetch(`/admin/users/${id}/impersonate`, { method: 'POST' });
      prompt('Impersonation token (valid 1h):', data.token);
    } catch(e) { showToast('Action failed', 'error'); }
  }

  function closeModal() { document.getElementById('modal-backdrop').classList.add('hidden'); }

  function exportCSV() {
    showToast('Exporting CSV… (connect backend export endpoint)');
  }

  function bootstrap() {
    document.getElementById('auth-gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('admin-email').textContent = localStorage.getItem('admin_email') || '';
    lucide.createIcons();
    loadUsers();
  }

  requireAdminAuth(bootstrap);
</script>
</body>
</html>
