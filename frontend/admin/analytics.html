<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics – Globetrotter Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>body { font-family: system-ui, sans-serif; }</style>
</head>
<body class="h-full text-gray-100 bg-gray-950">

<div id="auth-gate" class="fixed inset-0 bg-gray-950 z-50 flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-700 rounded-2xl p-8 w-full max-w-sm space-y-5 shadow-2xl">
    <div class="text-center"><div class="w-14 h-14 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-3"><i data-lucide="shield" class="w-7 h-7 text-white"></i></div><h1 class="text-xl font-bold">Admin Panel</h1></div>
    <input id="login-email" type="email" placeholder="Admin email" class="w-full bg-gray-800 border border-gray-600 rounded-xl px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
    <input id="login-password" type="password" placeholder="Password" class="w-full bg-gray-800 border border-gray-600 rounded-xl px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
    <button onclick="handleLogin()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition">Sign In</button>
    <p id="login-error" class="text-xs text-red-400 text-center hidden"></p>
  </div>
</div>

<div id="app" class="hidden h-full flex">
  <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
    <div class="px-5 py-5 border-b border-gray-800"><a href="dashboard.html" class="flex items-center gap-3"><div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center"><i data-lucide="compass" class="w-4 h-4 text-white"></i></div><span class="font-bold text-sm">Globetrotter Admin</span></a></div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</a>
      <a href="users.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="users" class="w-4 h-4"></i> Users</a>
      <a href="workspaces.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="building-2" class="w-4 h-4"></i> Workspaces</a>
      <a href="subscriptions.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="credit-card" class="w-4 h-4"></i> Subscriptions</a>
      <a href="payments.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="receipt" class="w-4 h-4"></i> Payments</a>
      <a href="analytics.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm bg-indigo-600 text-white"><i data-lucide="bar-chart-2" class="w-4 h-4"></i> Analytics</a>
      <a href="audit-logs.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="scroll-text" class="w-4 h-4"></i> Audit Logs</a>
      <a href="settings.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white"><i data-lucide="settings" class="w-4 h-4"></i> Settings</a>
    </nav>
    <div class="px-3 py-4 border-t border-gray-800"><button onclick="handleLogout()" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-red-400 hover:bg-red-950 w-full"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button></div>
  </aside>

  <main class="flex-1 overflow-y-auto">
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
      <h2 class="font-semibold text-lg">Analytics</h2>
      <div class="flex items-center gap-3">
        <select id="days-range" onchange="loadAll()" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs focus:outline-none">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
        <span id="admin-email" class="text-xs text-gray-400"></span>
      </div>
    </header>
    <div class="p-6 space-y-6">

      <!-- Revenue KPIs -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-xs text-gray-400">MRR</p><p id="kpi-mrr" class="text-2xl font-bold text-green-400 mt-1">—</p></div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-xs text-gray-400">ARR</p><p id="kpi-arr" class="text-2xl font-bold text-green-300 mt-1">—</p></div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-xs text-gray-400">ARPU</p><p id="kpi-arpu" class="text-2xl font-bold text-indigo-400 mt-1">—</p></div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-xs text-gray-400">Conversion Rate</p><p id="kpi-conv" class="text-2xl font-bold text-yellow-400 mt-1">—</p></div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
          <h3 class="text-sm font-semibold mb-4">User Growth</h3>
          <canvas id="chart-growth" height="200"></canvas>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
          <h3 class="text-sm font-semibold mb-4">Daily Revenue</h3>
          <canvas id="chart-revenue" height="200"></canvas>
        </div>
      </div>

      <!-- Plan breakdown + conversion funnel -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
          <h3 class="text-sm font-semibold mb-4">Subscriptions by Plan</h3>
          <canvas id="chart-plans" height="200"></canvas>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
          <h3 class="text-sm font-semibold mb-4">Trial vs Paid</h3>
          <canvas id="chart-conversion" height="200"></canvas>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="_admin.js"></script>
<script>
  let growthChart, revenueChart, plansChart, convChart;

  function destroyChart(c) { if (c) c.destroy(); }
  const chartOpts = { plugins: { legend: { labels: { color: '#9ca3af' } } }, scales: { x: { ticks: { color: '#9ca3af', maxTicksLimit: 7 }, grid: { color: '#1f2937' } }, y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } } } };
  const chartOptsPie = { plugins: { legend: { labels: { color: '#9ca3af' } } } };

  async function loadAll() {
    const days = document.getElementById('days-range').value;
    try {
      const [rev, growth, conv, breakdown] = await Promise.all([
        adminFetch(`/admin/analytics/revenue-metrics?days=${days}`),
        adminFetch(`/admin/analytics/growth-metrics?days=${days}`),
        adminFetch('/admin/analytics/conversion'),
        adminFetch('/admin/analytics/churn')
      ]);

      document.getElementById('kpi-mrr').textContent = fmtMoney(rev.mrr);
      document.getElementById('kpi-arr').textContent = fmtMoney(rev.arr);
      document.getElementById('kpi-arpu').textContent = fmtMoney(rev.arpu);
      document.getElementById('kpi-conv').textContent = (conv.conversionRate || 0) + '%';

      // Growth chart
      const gDates = Object.keys(growth.userGrowth || {}).sort();
      destroyChart(growthChart);
      growthChart = new Chart(document.getElementById('chart-growth').getContext('2d'), {
        type: 'line',
        data: { labels: gDates, datasets: [{ label: 'New Users', data: gDates.map(d => growth.userGrowth[d]), borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,0.1)', fill: true, tension: 0.3 }] },
        options: chartOpts
      });

      // Revenue chart
      const rDates = Object.keys(rev.dailyRevenue || {}).sort();
      destroyChart(revenueChart);
      revenueChart = new Chart(document.getElementById('chart-revenue').getContext('2d'), {
        type: 'bar',
        data: { labels: rDates, datasets: [{ label: 'Revenue ($)', data: rDates.map(d => rev.dailyRevenue[d]), backgroundColor: 'rgba(34,197,94,0.7)' }] },
        options: chartOpts
      });

      // Plans pie
      const bp = breakdown.byPlan || {};
      destroyChart(plansChart);
      plansChart = new Chart(document.getElementById('chart-plans').getContext('2d'), {
        type: 'doughnut',
        data: { labels: ['Starter', 'Pro', 'Business'], datasets: [{ data: [bp.starter || 0, bp.pro || 0, bp.business || 0], backgroundColor: ['#374151', '#4f46e5', '#16a34a'] }] },
        options: chartOptsPie
      });

      // Conversion pie
      destroyChart(convChart);
      convChart = new Chart(document.getElementById('chart-conversion').getContext('2d'), {
        type: 'doughnut',
        data: { labels: ['Paid', 'Trialing'], datasets: [{ data: [conv.paid || 0, conv.trialing || 0], backgroundColor: ['#16a34a', '#4f46e5'] }] },
        options: chartOptsPie
      });

    } catch(e) { console.error(e); }
  }

  function bootstrap() {
    document.getElementById('auth-gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('admin-email').textContent = localStorage.getItem('admin_email') || '';
    lucide.createIcons();
    loadAll();
  }
  requireAdminAuth(bootstrap);
</script>
</body>
</html>
