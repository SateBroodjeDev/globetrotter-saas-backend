# Globetrotter SaaS - Nginx Configuration
# Place at: /etc/nginx/sites-available/globetrotter
# Enable with: ln -s /etc/nginx/sites-available/globetrotter /etc/nginx/sites-enabled/

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name globetrotter.nl *.globetrotter.nl;
    return 301 https://$server_name$request_uri;
}

# API - api.globetrotter.nl
server {
    listen 443 ssl http2;
    server_name api.globetrotter.nl;

    ssl_certificate /etc/letsencrypt/live/globetrotter.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globetrotter.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS handled by Express

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}

# User App - app.globetrotter.nl
server {
    listen 443 ssl http2;
    server_name app.globetrotter.nl;

    ssl_certificate /etc/letsencrypt/live/globetrotter.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globetrotter.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /var/www/globetrotter/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Admin Dashboard - admin.globetrotter.nl
server {
    listen 443 ssl http2;
    server_name admin.globetrotter.nl;

    ssl_certificate /etc/letsencrypt/live/globetrotter.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globetrotter.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    root /var/www/globetrotter/frontend;
    index admin.html;

    # Optional: IP allowlist for admin
    # allow 1.2.3.4;
    # deny all;

    location / {
        try_files $uri $uri/ /admin.html;
    }
}

# Main domain - globetrotter.nl
server {
    listen 443 ssl http2;
    server_name globetrotter.nl;

    ssl_certificate /etc/letsencrypt/live/globetrotter.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globetrotter.nl/privkey.pem;

    return 301 https://app.globetrotter.nl$request_uri;
}
