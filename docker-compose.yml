version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: globetrotter_db
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: globetrotter_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U globetrotter']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: globetrotter_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globetrotter_api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://globetrotter:dev_password_change_in_prod@postgres:5432/globetrotter_db
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: globetrotter_network
